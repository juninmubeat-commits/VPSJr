name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
                             -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
                             -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        run: |
          Add-Type -AssemblyName System.Security
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4
          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          try {
              Get-LocalUser -Name "RDP" -ErrorAction Stop
              Write-Host "User RDP exists, resetting password..."
              Set-LocalUser -Name "RDP" -Password $securePass
          } catch {
              Write-Host "Creating new user RDP..."
              New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
              Add-LocalGroupMember -Group "Administrators" -Member "RDP"
              Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          }
          
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          $hostname = "my-persistent-vps"
          Write-Host "Conectando ao Tailscale..."
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=$hostname --force-reauth
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 20) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              if (-not $tsIP) {
                  Write-Host "Aguardando IP... tentativa $retries"
                  Start-Sleep -Seconds 5
              }
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }
          
          Write-Host "✅ Tailscale conectado!"
          Write-Host "IP: $tsIP"
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          echo "TAILSCALE_HOSTNAME=$hostname" >> $env:GITHUB_ENV

      - name: Enable SSH Server
        run: |
          Write-Host "📦 Instalando OpenSSH Server..."
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          
          Write-Host "🚀 Iniciando SSH..."
          Start-Service sshd
          Set-Service -Name sshd -StartupType 'Automatic'
          
          Write-Host "🔥 Configurando firewall..."
          New-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -DisplayName 'OpenSSH Server (sshd)' `
            -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 -ErrorAction SilentlyContinue
          
          Write-Host "🔧 Habilitando autenticação por senha..."
          $sshdConfig = "C:\ProgramData\ssh\sshd_config"
          if (Test-Path $sshdConfig) {
              $content = Get-Content $sshdConfig
              $content = $content -replace '#PasswordAuthentication yes', 'PasswordAuthentication yes'
              $content = $content -replace 'PasswordAuthentication no', 'PasswordAuthentication yes'
              $content = $content -replace '#PubkeyAuthentication yes', 'PubkeyAuthentication no'
              Set-Content $sshdConfig -Value $content
          }
          
          Write-Host "♻️ Reiniciando SSH..."
          Restart-Service sshd
          
          Write-Host "✅ SSH configurado!"
          Start-Sleep -Seconds 5
          
          $sshTest = Test-NetConnection -ComputerName localhost -Port 22
          if ($sshTest.TcpTestSucceeded) {
              Write-Host "✅ SSH está respondendo na porta 22!"
          } else {
              Write-Warning "⚠️ SSH pode não estar acessível"
          }
      
      - name: Verify RDP Accessibility
        run: |
          Write-Host "Verificando RDP..."
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if ($testResult.TcpTestSucceeded) {
              Write-Host "✅ RDP acessível!"
          }

      - name: Install WSL and Ubuntu
        run: |
          Write-Host "Instalando WSL..."
          wsl --install --no-distribution
          Start-Sleep -Seconds 20
          wsl --install -d Ubuntu-22.04 --no-launch
          Write-Host "✅ WSL instalado!"

      - name: Maintain Connection with Keepalive
        run: |
          Write-Host "`n=== 🚀 ACESSO CONFIGURADO ==="
          Write-Host "IP: $env:TAILSCALE_IP"
          Write-Host "Hostname: $env:TAILSCALE_HOSTNAME"
          Write-Host "Username: RDP"
          Write-Host "Password: $($env:RDP_CREDS -replace '.*Password: ','')"
          Write-Host "=============================`n"
          Write-Host "SSH: ssh RDP@$env:TAILSCALE_IP"
          Write-Host "RDP: $env:TAILSCALE_IP (Remote Desktop)`n"
          
          $counter = 0
          while ($true) {
              $counter++
              Write-Host "[$(Get-Date -Format 'HH:mm:ss')] 🟢 Ativo | Check #$counter"
              
              # Verificar Tailscale
              $tsStatus = & "$env:ProgramFiles\Tailscale\tailscale.exe" status --json | ConvertFrom-Json
              if (-not $tsStatus) {
                  Write-Warning "Reconectando Tailscale..."
                  & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=$env:TAILSCALE_HOSTNAME
              }
              
              Start-Sleep -Seconds 120
          }
